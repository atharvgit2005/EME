<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>EME Real-Time Video Trial — Shotcraft Editorial & Visual Assembly</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      
            @font-face {
              font-family: 'Inter';
              src: url('./Inter-Variable.ttf');
              font-weight: normal;
              font-style: normal;
            }
          

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #080b11;
      }
      #main {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="main"
         data-composition-id="main"
         data-width="1920"
         data-height="1080"
         data-start="0"
         data-duration="6"
         data-fps="30">
      
        <div id="clip_act1_sceneA"
             class="clip"
             data-start="0"
             data-duration="3"
             data-track-index="10"
             style="position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; box-sizing: border-box; z-index: 10; transform: translate(0px, 0px) scale(1, 1) rotate(0deg); opacity: 1;">
          <video src="./shotcraft-source.mp4" muted playsinline autoplay loop style="width:100%; height:100%; object-fit:cover;"></video>
        </div>
      

        <div id="clip_act2_sceneB"
             class="clip"
             data-start="3"
             data-duration="3"
             data-track-index="10"
             style="position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; box-sizing: border-box; z-index: 10; transform: translate(0px, 0px) scale(1, 1) rotate(0deg); opacity: 1;">
          <video src="./shotcraft-source.mp4" muted playsinline autoplay loop style="width:100%; height:100%; object-fit:cover;"></video>
        </div>
      

        <div id="clip_title_overlay"
             class="clip"
             data-start="0"
             data-duration="3.5"
             data-track-index="30"
             style="position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; box-sizing: border-box; z-index: 30; transform: translate(0px, 380px) scale(1, 1) rotate(0deg); opacity: 0.95; font-family: 'Inter', sans-serif; font-size: 44px; color: #ffffff; text-align: center; letter-spacing: 4px; display: flex; align-items: center; justify-content: center;">
          ARC STUDIO // SHOTCRAFT PROMO
        </div>
      
      
          <audio id="clip_audio_bed" src="./snowfall.mp3" data-start="0" data-duration="6" data-volume="0.8" volume="0.8" data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":0.5,"v":0.75},{"t":3,"v":0.45},{"t":5.5,"v":0.75},{"t":6,"v":0}]}]}'></audio>
        
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // Clip timeline tweens
      
        tl.set("#clip_act1_sceneA", { autoAlpha: 0 }, 3);
      

          gsap.set("#clip_act2_sceneB", { autoAlpha: 0 });
          tl.set("#clip_act2_sceneB", { autoAlpha: 1 }, 3);
        

        tl.set("#clip_act2_sceneB", { autoAlpha: 0 }, 6);
      

        tl.set("#clip_title_overlay", { autoAlpha: 0 }, 3.5);
      

            tl.fromTo("#clip_title_overlay",
              { opacity: 0 },
              { opacity: 0.95, duration: 0.5, ease: "power2.out" },
              0
            );
          

            tl.fromTo("#clip_title_overlay",
              { opacity: 0.95 },
              { opacity: 0.95, duration: 2.5, ease: "linear" },
              0.5
            );
          

            tl.fromTo("#clip_title_overlay",
              { opacity: 0.95 },
              { opacity: 0, duration: 0.5, ease: "power2.in" },
              3
            );
          

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
