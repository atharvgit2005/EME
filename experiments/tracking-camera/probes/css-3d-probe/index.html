<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>EME CSS 3D Camera & HUD Probe</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1920px;
        height: 1080px;
        background: #050508;
        overflow: hidden;
        font-family: 'Courier New', monospace;
        color: #f8fafc;
      }
      #viewport {
        position: relative;
        width: 1920px;
        height: 1080px;
        perspective: 1100px;
        perspective-origin: 50% 50%;
        overflow: hidden;
      }
      #world-plane {
        position: absolute;
        width: 1920px;
        height: 1080px;
        top: 0;
        left: 0;
        transform-style: preserve-3d;
        transform-origin: 50% 50%;
        background: radial-gradient(circle at 50% 50%, #0d131f 0%, #030407 100%);
        border: 2px solid #1e293b;
      }
      .grid-lines {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(to right, rgba(56, 189, 248, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      .code-content {
        position: absolute;
        top: 250px;
        left: 200px;
        font-size: 32px;
        line-height: 1.6;
        color: #38bdf8;
      }
      .hero-target {
        display: inline-block;
        color: #f43f5e;
        font-weight: bold;
        text-shadow: 0 0 15px rgba(244, 63, 94, 0.6);
      }

      /* 2D HUD Camera-Space Overlay (Not tilted) */
      #hud-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 100;
      }
      .hud-bracket {
        position: absolute;
        border: 2px solid #22c55e;
        box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
        transition: border-color 0.1s;
      }
      .hud-telemetry {
        position: absolute;
        font-size: 14px;
        letter-spacing: 2px;
        color: #22c55e;
        top: -24px;
        left: 0;
        white-space: nowrap;
      }
      .crosshair {
        position: absolute;
        width: 16px;
        height: 16px;
        transform: translate(-50%, -50%);
      }
      .crosshair::before, .crosshair::after {
        content: '';
        position: absolute;
        background: #22c55e;
      }
      .crosshair::before { top: 7px; left: 0; width: 16px; height: 2px; }
      .crosshair::after { top: 0; left: 7px; width: 2px; height: 16px; }
    </style>
  </head>
  <body>
    <div id="main"
         data-composition-id="css3d_probe"
         data-width="1920"
         data-height="1080"
         data-start="0"
         data-duration="3.0"
         data-fps="30">
      
      <div id="viewport">
        <!-- 3D Tilted Plane -->
        <div id="world-plane">
          <div class="grid-lines"></div>
          <div class="code-content">
            <div>&gt; initialize_agent_runtime()</div>
            <div>&gt; loading neural checkpoints: 14/14</div>
            <div>&gt; tool_call: <span id="target-span" class="hero-target">render_camera_hud()</span></div>
            <div>&gt; status: 0 errors detected</div>
          </div>
        </div>

        <!-- 2D HUD Overlay in Camera Screen-Space -->
        <div id="hud-layer">
          <div id="tracker-box" class="hud-bracket">
            <div id="telemetry-label" class="hud-telemetry">TGT: [x: 820, y: 350] LOCK: ON</div>
          </div>
          <div id="crosshair-center" class="crosshair"></div>
        </div>
      </div>
    </div>

    <script>
      // Timeline animation setup
      const tl = gsap.timeline({ paused: true });

      // Animate Camera 3D Transform
      tl.fromTo("#world-plane", 
        { rotateX: 18, rotateY: -22, rotateZ: 2, scale: 1.15, x: 50, y: 30 },
        { rotateX: 10, rotateY: -12, rotateZ: -1, scale: 1.25, x: -30, y: 0, duration: 3.0, ease: "power1.inOut" },
        0
      );

      // Animate HUD Tracking Box Locking
      tl.fromTo("#tracker-box",
        { left: 750, top: 320, width: 340, height: 60, borderColor: "#38bdf8" },
        { left: 810, top: 360, width: 310, height: 55, borderColor: "#ef4444", duration: 2.0, ease: "power2.out" },
        0
      );

      // 2-frame lock flash at t=2.0s
      tl.set("#tracker-box", { backgroundColor: "rgba(239, 68, 68, 0.25)", borderColor: "#ffffff" }, 2.0);
      tl.set("#tracker-box", { backgroundColor: "transparent", borderColor: "#ef4444" }, 2.066);

      // Crosshair tracking motion
      tl.fromTo("#crosshair-center",
        { left: 920, top: 350 },
        { left: 965, top: 387, duration: 2.0, ease: "power2.out" },
        0
      );

      // HyperFrames timeline sync
      window.__timelines = window.__timelines || {};
      window.__timelines["css3d_probe"] = tl;
      window.__timelines["main"] = tl;
      window.__hyperframes_seek = function(sec) {
        tl.seek(sec);
      };
    </script>
  </body>
</html>
